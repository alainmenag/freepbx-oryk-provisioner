# Packages the module as oryk_provisioner-<version>.zip and attaches it to a
# GitHub Release whenever a tag is pushed. The tag (with or without a leading
# "v") must equal <version> in module.xml, or nothing is published.
# What goes in the zip is decided by export-ignore in .gitattributes.
# Nothing is published unless the tests pass: tests/smoke.php against stubs,
# and tests/services_db.php against the MariaDB service below.
name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: oryk_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - name: Check tag against module.xml
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(grep -m1 -oP '(?<=<version>)[^<]+' module.xml)"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match module.xml version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Lint PHP
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Smoke tests
        run: php tests/smoke.php

      - name: Service tables, against MariaDB
        env:
          ORYK_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=oryk_test
          ORYK_TEST_USER: root
          ORYK_TEST_PASS: root
        run: php tests/services_db.php

      - name: Build zip
        run: |
          git archive --format=zip --prefix=oryk_provisioner/ \
            -o "oryk_provisioner-${{ steps.version.outputs.version }}.zip" "$GITHUB_REF_NAME"
          unzip -l "oryk_provisioner-${{ steps.version.outputs.version }}.zip"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "oryk_provisioner-${{ steps.version.outputs.version }}.zip" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
